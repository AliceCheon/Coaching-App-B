<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Barbell Diva B · Lettura (telefono)</title>
<link rel="icon" href="data:,">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="../comune/tema-b.css">
<script src="../app-config-b.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<style>
:root{--pink:#ff4fa3;--pink-hot:#ff2d95;--pink2:#ff80c1;--pink-soft:#ffb8dc;--purple:#a855f7;--core:#ffe066;--testo-azione:#190c1c;--sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--mono:"JetBrains Mono","Cascadia Mono","SF Mono",ui-monospace,Consolas,"Courier New",monospace}
html[data-theme="dark"]{background:#090918;color-scheme:dark}
body[data-theme="dark"]{--gradiente:linear-gradient(160deg,#050612 0%,#0b0b20 55%,#080719 100%);--surface:#15152f;--raised:#211b3e;--text:#fff8fd;--muted:#cbbbd7;--line:rgba(202,107,225,.24);--line-soft:rgba(255,255,255,.085);--campo:#17111f;--lav:#c9a7ff;--verde:#7be0a8;--ombra:rgba(0,0,0,.55);--barra:#120a1e}
html[data-theme="light"]{background:#fff7fb;color-scheme:light}
body[data-theme="light"]{--gradiente:linear-gradient(160deg,#a985d4 0%,#cfafe8 38%,#e7c9e8 72%,#b897db 100%);--surface:#fffafd;--raised:#f8eafa;--text:#241238;--muted:#705b82;--line:rgba(105,55,145,.18);--line-soft:rgba(84,43,116,.10);--campo:#fffafd;--lav:#7c2bd1;--verde:#237350;--ombra:rgba(78,37,111,.18);--barra:#fffafd}
body{margin:0;min-height:100vh}
/* ---- impianto telefono: testata, colonna di carte, barra di vetro ---- */
.testata{position:relative;z-index:1;padding:calc(16px + env(safe-area-inset-top)) 16px 14px}
.marchio{display:flex;align-items:center;gap:10px;min-width:0}
.marchio-bot{display:grid;place-items:center;width:36px;height:36px;flex:0 0 auto;border-radius:50%;background:linear-gradient(140deg,var(--purple),var(--pink));box-shadow:0 8px 18px -8px color-mix(in srgb,var(--pink) 80%,transparent);overflow:hidden}
.marchio-bot svg{display:block;width:100%;height:100%}
.marchio-bot .bot-shell{fill:#fdfbff;stroke:#b9a6d0;stroke-width:3}
.marchio-bot .bot-joint{fill:#efe6f7;stroke:#b9a6d0;stroke-width:3}
.marchio-bot .bot-screen{fill:#241a2e}
.marchio-bot .bot-glint{fill:#3a2a4a;opacity:.65}
.marchio-bot .bot-face-fill{fill:#ff9ad5}
.marchio-bot .bot-face-line{fill:none;stroke:#ff9ad5;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.marchio-bot .bot-heart{fill:#ff72c2}
.marchio-testo{min-width:0}
.marchio-nome{font-size:16.6px;font-weight:850;letter-spacing:0;line-height:1.15;text-transform:none}
.marchio-nome i{font-style:italic;font-weight:600;color:var(--lav)}
.marchio-motto{margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.2px;color:var(--muted);letter-spacing:0}
.marchio-ver{font-family:var(--mono);font-size:9px;line-height:1;padding:3px 7px;border-radius:999px;border:1px solid color-mix(in srgb,var(--lav) 42%,transparent);background:color-mix(in srgb,var(--lav) 12%,transparent);color:var(--lav);white-space:nowrap}
.testata h1{margin:16px 0 4px;font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.testata .motto{margin-bottom:10px}
.testata .sotto{font-family:var(--mono);font-size:10.5px;line-height:1.5}
main.colonna{position:relative;z-index:1;padding:2px 14px 190px}
.colonna{display:flex;flex-direction:column;gap:13px}
.carta{border-radius:20px;padding:16px 16px 13px}
.carta h2{font-size:10px}
#vistaLogin .riga{margin-top:10px}
#vistaLogin .azione{width:100%;margin-top:16px}
.errore{font-size:11.5px}
.pre{font-size:10.5px}
.fonte{font-size:10px}
/* la barra in basso: vetro, non una striscia piena */
.barra-fondo{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;align-items:center;padding:11px 14px;padding-bottom:calc(11px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--barra) 88%,transparent);border-top:1px solid color-mix(in srgb,var(--pink) 22%,transparent);box-shadow:0 -22px 44px -26px var(--ombra);backdrop-filter:blur(18px) saturate(130%);-webkit-backdrop-filter:blur(18px) saturate(130%)}
.barra-fondo .azione{flex:1.6;padding:11px 14px}
.barra-fondo .bottone-secondario{flex:1;padding:11px 10px;font-size:12.5px}
/* Fase 2h: la frase e la figura sulla stessa riga (`.strip` del mockup).
   Il contenitore prende tutta la larghezza utile sopra la barra di vetro;
   la figura resta 64 px e la bolla si allarga quanto serve. */
.diva{left:14px;right:14px;bottom:88px;align-items:stretch}
.bd-striscia-sbt .bd-diva{width:100%}
.bd-striscia-bolla{font-size:12.5px}
@media (min-width:760px){
main.colonna{max-width:620px;margin:0 auto}
}
</style>
</head>
<body data-theme="dark">
<header class="testata">
  <div class="marchio">
    <span class="marchio-bot" aria-hidden="true"><svg class="bot" viewBox="38 28 164 148" aria-hidden="true" focusable="false"><g class="bot-antenna"><path d="M120 49V31" fill="none" stroke="#c7b8d8" stroke-width="7" stroke-linecap="round"/><path d="M120 29c-13-15-30 4 0 23 30-19 13-38 0-23Z" fill="#ff72c2" stroke="#ffe1f4" stroke-width="3"/></g><g class="bot-arm"><circle class="bot-joint" cx="68" cy="177" r="13"/><path class="bot-shell" d="M64 171c-17 1-27 13-28 29-1 12 7 20 17 17 9-3 13-15 16-30Z"/><circle class="bot-joint" cx="47" cy="211" r="10"/></g><g class="bot-arm"><circle class="bot-joint" cx="172" cy="177" r="13"/><path class="bot-shell" d="M176 171c17 1 27 13 28 29 1 12-7 20-17 17-9-3-13-15-16-30Z"/><circle class="bot-joint" cx="193" cy="211" r="10"/></g><g class="bot-body"><path class="bot-shell" d="M76 164c10-14 78-14 88 0l-7 68c-13 16-61 16-74 0Z"/><path d="M86 176h68l-5 42c-13 11-45 11-58 0Z" fill="#ded5e9" stroke="#9f87bb" stroke-width="3"/><path class="bot-heart" d="M120 189c-10-12-24 3 0 20 24-17 10-32 0-20Z"/><path class="bot-shell" d="M90 230l-8 18h34l4-16m30-2 8 18h-34l-4-16"/></g><g class="bot-barbell"><rect x="35" y="203" width="170" height="8" rx="4" fill="#f5eaff" stroke="#9f87bb" stroke-width="3"/><rect x="22" y="184" width="16" height="46" rx="6" fill="#ff72c2" stroke="#6f4c86" stroke-width="4"/><rect x="9" y="191" width="15" height="32" rx="5" fill="#c96cff" stroke="#6f4c86" stroke-width="4"/><rect x="202" y="184" width="16" height="46" rx="6" fill="#ff72c2" stroke="#6f4c86" stroke-width="4"/><rect x="216" y="191" width="15" height="32" rx="5" fill="#c96cff" stroke="#6f4c86" stroke-width="4"/></g><g class="bot-head"><path class="bot-shell" d="M45 73c15-27 135-27 150 0 12 20 12 72-3 91-21 27-123 27-144 0-15-19-15-71-3-91Z"/><path d="M41 96c-16 5-18 44-1 51m159-51c16 5 18 44 1 51" fill="#efe6f7" stroke="#ff72c2" stroke-width="7" stroke-linecap="round"/><rect class="bot-screen" x="57" y="83" width="126" height="77" rx="31"/><path class="bot-glint" d="M75 92c20-8 34-9 52-8-16 4-30 12-40 22Z"/><g class="bot-eyes"><circle class="bot-face-fill" cx="93" cy="117" r="8"/><circle class="bot-face-fill" cx="147" cy="117" r="8"/></g><path class="bot-face-line" d="M103 137q17 15 34 0"/></g></svg></span>
    <div class="marchio-testo">
      <div class="marchio-nome">Barbell <i>Diva</i></div>
      <div class="marchio-motto">Lift. Slay. Repeat. <span class="marchio-ver" data-versione></span></div>
    </div>
  </div>
  <h1>Lettura di oggi</h1>
  <div id="statoUtente" class="sotto"></div>
</header>
<main class="colonna">
  <div id="vistaLogin" class="carta" hidden>
    <h2>Accesso</h2>
    <p class="riga">Entra con Google, come nell'app A: B legge soltanto.</p>
    <button id="bottoneEntra" class="azione" type="button">Entra con Google</button>
  </div>
  <div id="vistaDash" hidden>
    <div id="messaggioErrore" class="errore"></div>
    <section id="griglia" class="colonna"></section>
  </div>
</main>
<div class="barra-fondo">
  <button id="bottoneRicarica" class="azione" type="button">Ricarica</button>
  <button id="bottoneTema" class="bottone-secondario" type="button">Tema</button>
  <button id="bottoneEsci" class="bottone-secondario" type="button">Esci</button>
</div>
<div id="divaContenitore" class="diva" data-avvio-b></div>
<script type="module" src="./app.js"></script>
</body>
</html>
